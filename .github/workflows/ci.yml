name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: mkdir -p test-results
      - run: npm test -- --ci --passWithNoTests --json --outputFile=test-results/jest-results.json
      - name: Test Summary
        if: always()
        run: |
          if [ -f test-results/jest-results.json ]; then
            TOTAL=$(jq '.numTotalTests' test-results/jest-results.json)
            PASSED=$(jq '.numPassedTests' test-results/jest-results.json)
            FAILED=$(jq '.numFailedTests' test-results/jest-results.json)
            echo "### Test Results" >> $GITHUB_STEP_SUMMARY
            echo "**Total:** $TOTAL | **Passed:** $PASSED | **Failed:** $FAILED" >> $GITHUB_STEP_SUMMARY
          fi

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (local)
        run: |
          supabase init --workdir . || true
          supabase start --workdir .

      - name: Apply all migrations from scratch
        run: |
          # Reset database and apply all migrations (000 → current)
          # This catches migrations that only work against pre-existing state
          supabase db reset --workdir .

      - name: Verify migration chain
        run: echo "Migration check passed - all migrations apply cleanly from scratch"

      - name: Stop Supabase
        if: always()
        run: supabase stop --workdir .

  working-data-check:
    name: working_data Freeze Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for working_data violations
        run: |
          chmod +x scripts/check-working-data.sh
          ./scripts/check-working-data.sh
